<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid and Flexbox Layout</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom responsiveness for small screens -->
  <style>
    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="p-4">
  <!-- Header -->
  <header class="bg-blue-500 text-white p-4">
    <h1 class="text-3xl font-bold text-center">Grid and Flexbox Layout</h1>
  </header>

  <!-- Main content area -->
  <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4 min-h-screen">
    <!-- Main section using Flexbox -->
    <section class="lg:col-span-2 flex justify-between">
      <div class="bg-red-200 p-4 w-1/2 m-2 text-center rounded shadow">
        Flexbox Item 1
      </div>
      <div class="bg-red-400 p-4 w-1/2 m-2 text-center rounded shadow">
        Flexbox Item 2
      </div>
    </section>

    <!-- Sidebar -->
    <aside class="bg-green-200 p-4 text-center rounded shadow">
      Sidebar
    </aside>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white p-4 mt-4 text-center">
    <p>&copy; 2024 John Doe's Blog</p>
  </footer>
</body>
</html>
