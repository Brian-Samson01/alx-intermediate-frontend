<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="utf-8">

    <!-- Meta Tags for SEO and Accessibility -->
    <meta name="description" content="A blog post about semantic HTML and accessibility practises">
    <meta name="keywords" content="HTML, Semantic, Accessibility, Blog, SEO">
    <meta name="author" content="Brian Samson">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Title -->
    <title>Semantic HTML Blog Post</title>
  </head>

  <body>
    <!-- Header Section -->
    <header>
      <nav>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- Main Content -->
    <main>
      <article>
        <h1>Welcome to My First Semantic HTML Page</h1>
        <section>
          <p>
            This is a simple example of how to structure a web page using semantic HTML elements such as
            <code>&lt;header&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;article&gt;</code>, <code>&lt;section&gt;</code>,
            and <code>&lt;footer&gt;</code>.
          </p>
        </section>
      </article>
    </main>

    <!-- Footer Section -->
    <footer>
      <p>&copy; copyright</p>
    </footer>
  </body>
</html>
